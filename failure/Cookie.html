      #cookie {
        justify-self: center;
      }
      #cookie:active {
        transform: scale(0.95);
        transition-duration: 50ms;
      }

      #score {
        background-color: cornflowerblue;
        text-align: center;
        justify-self: center;
        padding: 12px 50px;
        margin-left: 10px;
        border-radius: 40px;
      }

      button {
        margin-left: 60px;
        padding: 12px 50px;
        border-radius: 15px;
        background-color: gold;
      }

      #content {
        border-style: ridge;
        padding: 20%;
        background-image: linear-gradient(
          to bottom,
          rgb(255, 186, 57),
          rgb(248, 112, 58)
        );
        border-color: darkgoldenrod;
      }
      .combo-text {
        position: absolute;
        font-size: 42px;
        font-weight: bold;
        color: yellow;
        text-shadow: 3px 3px 6px black;
        pointer-events: none;
        animation: comboPop 1s ease-out forwards;
      }

      @keyframes comboPop {
        0% {
          opacity: 0;
          transform: scale(0.5) translateY(0px);
        }

        20% {
          opacity: 1;
          transform: scale(1.3) translateY(-10px);
        }

        100% {
          opacity: 0;
          transform: scale(1) translateY(-100px);
        }
      }

      .particle {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        pointer-events: none;
        animation: explode 0.8s ease-out forwards;
      }

      @keyframes explode {
        0% {
          opacity: 1;
          transform: translate(0px, 0px) scale(1);
        }

        100% {
          opacity: 0;
          transform: translate(var(--x), var(--y)) scale(0);
        }
      }

      .floating-text {
        position: absolute;

        font-size: 28px;
        font-weight: bold;

        pointer-events: none;

        background: linear-gradient(
          90deg,
          red,
          orange,
          yellow,
          lime,
          cyan,
          blue,
          violet
        );

        background-size: 300% 300%;

        background-clip: text;

        text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.5);

        animation:
          floatRandom 1s ease-out forwards,
          rainbowMove 2s linear infinite;
      }

      @keyframes floatRandom {
        0% {
          opacity: 1;
          transform: translate(0px, 0px) scale(1) rotate(0deg);
        }

        100% {
          opacity: 0;

          transform: translate(var(--randomX), var(--randomY)) scale(1.5)
            rotate(var(--rotate));
        }
      }

      @keyframes rainbowMove {
        0% {
          background-position: 0% 50%;
        }

        100% {
          background-position: 100% 50%;
        }
      }

      .shake {
        animation: cookieShake 0.25s;
      }

      @keyframes cookieShake {
        0% {
          transform: translate(0px, 0px) rotate(0deg);
        }
        20% {
          transform: translate(-6px, 2px) rotate(-3deg);
        }
        40% {
          transform: translate(6px, -2px) rotate(3deg);
        }
        60% {
          transform: translate(-4px, 1px) rotate(-2deg);
        }
        80% {
          transform: translate(4px, -1px) rotate(2deg);
        }
        100% {
          transform: translate(0px, 0px) rotate(0deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="content">
      <img
        src="Cookie.png"
        alt="Cookie"
        width="400px"
        id="cookie"
        onclick="cookieClick(event)"
      />
      <div id="score">0</div>
      <button id="autoButton" onclick="autoclickUpgrade()">
        Auto Clicks (100 clicks)
      </button>
      <button id="multiButton" onclick="clickMultiUpgrade()">
        Multi Clicks (100 clicks)
      </button>
    </div>
  </body>
  <script>
    //config

    //Autoclick
    var autoclickamount = 0;
    var autoclickCostPerLevel = 100;
    var autoclickCost = 100;

    // clickMulti
    var clickMulti = 1;
    var clickMultiCostPerLevel = 100;
    var clickMultiCost = 100;

    var score = 0;
    var scoreBox = document.getElementById("score");
    var autoButton = document.getElementById("autoButton");
    var combo = 0;
    var comboTimer;
    var cookie = document.getElementById("cookie");

    function autoclickUpgrade() {
      if (score >= autoclickCost) {
        score -= autoclickCost;
        autoclickamount += 1;
        scoreBox.innerHTML = score;
        saveGame();
        autoclickCost += autoclickCostPerLevel;
        autoButton.innerHTML = "Auto Clicks (" + autoclickCost + " Clicks)";
      }
    }

    function clickMultiUpgrade() {
      if (score >= clickMultiCost) {
        score -= clickMultiCost;
        clickMulti += 1;
        scoreBox.innerHTML = score;
        saveGame();
        clickMultiCost += clickMultiCostPerLevel;
        multiButton.innerHTML = "Multi Clicks (" + clickMultiCost + " Clicks)";
      }
    }
    function autoClick() {
      score = score + 1 * autoclickamount;
      scoreBox.innerHTML = score;
      saveGame();
    }
    setInterval(autoClick, 250);

    function cookieClick(event) {
      score = score + 1 * clickMulti;
      scoreBox.innerHTML = score;
      saveGame();
      // floating text
      const text = document.createElement("div");
      text.className = "floating-text";
      text.innerHTML = "+" + clickMulti;

      text.style.left = event.pageX + "px";
      text.style.top = event.pageY + "px";

      document.body.appendChild(text);

      setTimeout(() => {
        text.remove();
      }, 1000);
    }

    function saveGame() {
      var saveData = {
        autoclickamount: autoclickamount,
        autoclickCostPerLevel: autoclickCostPerLevel,
        autoclickCost: autoclickCost,
        clickMulti: clickMulti,
        clickMultiCostPerLevel: clickMultiCostPerLevel,
        clickMultiCost: clickMultiCost,
        score: score,
      };

      var saveText = JSON.stringify(saveData);
      console.log(saveText);
      document.cookie = saveText;
    }

    function loadGame() {
      var cookieText = document.cookie;
      cookieText = JSON.parse(cookieText);

      autoclickamount = cookieText.autoclickamount;
      autoclickCostPerLevel = cookieText.autoclickCostPerLevel;
      autoclickCost = cookieText.autoclickCost;
      clickMulti = cookieText.clickMulti;
      clickMultiCostPerLevel = cookieText.clickMultiCostPerLevel;
      clickMultiCost = cookieText.clickMultiCost;
      score = cookieText.score;
    }

    function cookieClick(event) {
      score += 1 * clickMulti;
      scoreBox.innerHTML = score;
      cookie.classList.remove("shake");

      /* restart animation */
      void cookie.offsetWidth;

      cookie.classList.add("shake");

      saveGame();
      createParticles(event.pageX, event.pageY);
      // floating +score text
      const text = document.createElement("div");
      text.className = "floating-text";
      text.innerHTML = "+" + clickMulti;

      text.style.left = event.pageX + "px";
      text.style.top = event.pageY + "px";
      const randomX = (Math.random() - 0.5) * 120 + "px";
      const randomY = -Math.random() * 120 - 40 + "px";
      const randomRotate = (Math.random() - 0.5) * 40 + "deg";

      text.style.setProperty("--randomX", randomX);
      text.style.setProperty("--randomY", randomY);
      text.style.setProperty("--rotate", randomRotate);

      document.body.appendChild(text);

      setTimeout(() => {
        text.remove();
      }, 1000);

      // combo system
      combo++;

      clearTimeout(comboTimer);

      comboTimer = setTimeout(() => {
        combo = 0;
      }, 1000);

      // every 10 clicks show combo text
      if (combo % 10 === 0) {
        const comboText = document.createElement("div");

        comboText.className = "combo-text";

        const messages = [
          "COMBO x" + combo,
          "MEGA CLICK!",
          "COOKIE FRENZY!",
          "INSANE!",
          "SUGAR RUSH!",
        ];

        comboText.innerHTML =
          messages[Math.floor(Math.random() * messages.length)];

        comboText.style.left = event.pageX - 50 + "px";
        comboText.style.top = event.pageY - 50 + "px";

        document.body.appendChild(comboText);

        setTimeout(() => {
          comboText.remove();
        }, 1000);
      }
    }

    function createParticles(x, y) {
      for (let i = 0; i < 15; i++) {
        const particle = document.createElement("div");
        particle.className = "particle";

        // random colors
        const colors = ["chocolate", "black"];

        particle.style.background =
          colors[Math.floor(Math.random() * colors.length)];

        particle.style.left = x + "px";
        particle.style.top = y + "px";

        // random explosion direction
        const randomX = (Math.random() - 0.5) * 200 + "px";
        const randomY = (Math.random() - 0.5) * 200 + "px";

        particle.style.setProperty("--x", randomX);
        particle.style.setProperty("--y", randomY);

        document.body.appendChild(particle);

        setTimeout(() => {
          particle.remove();
        }, 800);
      }
    }
  </script>
